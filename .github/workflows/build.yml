name: APK 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 서명 키 꺼내기 (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets에 KEYSTORE_BASE64가 없습니다. 서명 없이는 폰에 설치할 수 없습니다."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/tetherwatch.jks

      - name: APK 만들기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk TetherWatch.apk

      - name: 실행 결과에 첨부 (Actions 화면에서 내려받기)
        uses: actions/upload-artifact@v4
        with:
          name: TetherWatch-apk
          path: TetherWatch.apk

      - name: Releases에 최신 APK 올리기 (폰에서 바로 내려받기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TetherWatch.apk --title "최신 APK" --notes "자동 빌드 ${GITHUB_SHA::7}"
